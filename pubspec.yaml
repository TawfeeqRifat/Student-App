name: student_app
description: "Connect parents and students with Institution"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_otp_text_field: ^1.5.1+1
  device_preview: ^1.2.0
  pin_code_fields: ^8.0.1
  get: ^4.7.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/
    - assets/icons/attendance_icon.png
    - assets/icons/

  uses-material-design: true

